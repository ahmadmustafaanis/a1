[project]
name = "lumen-api"
version = "0.1.0"
description = "Lumen: Opus-orchestrated 3D scan explainer with weight-space diagnosis"
requires-python = ">=3.12,<3.13"
dependencies = [
    "claude-agent-sdk>=0.2.179",
    "fast-simplification>=0.2.0",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "nibabel>=5.4.2",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "sse-starlette>=3.7.0",
    "torch>=2.15.0",
    "totalsegmentator>=2.18.0",
    "trimesh>=5.2.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
